<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIYU 員工端</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap">
<div id="login" class="card"><div class="logo">HIYU</div><h2>員工登入</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button class="btn" onclick="login()">登入</button><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="top"><div><div class="logo">HIYU</div><div id="employeeName" class="muted"></div></div><button class="smallbtn" onclick="logout()">登出</button></div>
<section class="card"><h2>今日</h2><div id="todayInfo"></div><button id="clockBtn" class="btn" onclick="clockAction()">上班打卡</button><div id="clockMsg"></div></section>
<section id="announcements" class="card hidden"><h2>📢 今日公告</h2><div id="announcementList"></div><button class="btn" onclick="markAnnouncementsRead()">我已閱讀</button></section>
<section class="card"><h2>📋 今日工作</h2><div id="taskList"></div></section>
<section class="card"><h2>📅 我的排班</h2><div id="scheduleList"></div></section>
<section class="card"><h2>📝 申請</h2><a class="btn secondary" href="#leave">請假申請</a><a class="btn secondary" href="#correction">出勤異動申請</a></section>
<section id="leave" class="card"><h2>請假申請</h2><div class="field"><label>日期</label><input id="leaveDate" type="date"></div><div class="field"><label>原因</label><textarea id="leaveReason"></textarea></div><button class="btn" onclick="submitLeave()">送出申請</button><div id="leaveMsg"></div></section>
<section id="correction" class="card"><h2>出勤異動申請</h2><div class="field"><label>日期</label><input id="corrDate" type="date"></div><div class="field"><label>說明</label><textarea id="corrReason"></textarea></div><button class="btn" onclick="submitCorrection()">送出申請</button><div id="corrMsg"></div></section>
<section class="card"><h2>💰 今日交班／結帳</h2><div class="grid"><div class="field"><label>現金</label><input id="cash" type="number"></div><div class="field"><label>LINE Pay</label><input id="linepay" type="number"></div><div class="field"><label>其他支付</label><input id="otherpay" type="number"></div><div class="field"><label>今日支出</label><input id="expenses" type="number"></div></div><div class="field"><label>現金差額</label><input id="difference" type="number" value="0"></div><div class="field"><label>交班備註</label><textarea id="handover"></textarea></div><button class="btn" onclick="submitClosing()">送出今日交班</button><div id="closingMsg"></div></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(window.HIYU_SUPABASE_URL,window.HIYU_SUPABASE_ANON_KEY);
let user=null, employee=null, clockedIn=false, announcementIds=[];
const today=()=>new Date().toISOString().slice(0,10);
function msg(id,t,ok=false){document.getElementById(id).innerHTML='<p class="'+(ok?'success':'error')+'">'+t+'</p>'}
async function login(){let email=document.getElementById('email').value,password=document.getElementById('password').value;let r=await sb.auth.signInWithPassword({email,password});if(r.error)return msg('loginMsg',r.error.message);await boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){let s=await sb.auth.getSession();user=s.data.session?.user;if(!user)return;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');let r=await sb.from('employees').select('*').eq('auth_user_id',user.id).single();employee=r.data;if(employee)document.getElementById('employeeName').textContent=employee.name+'｜'+(employee.employee_no||'');await loadAll()}
async function loadAll(){document.getElementById('todayInfo').innerHTML='日期：'+today();await loadClock();await loadAnnouncements();await loadTasks();await loadSchedule()}
async function loadClock(){let r=await sb.from('attendance').select('*').eq('employee_id',employee.id).eq('work_date',today()).order('clock_in',{ascending:false}).limit(1).maybeSingle();let a=r.data;clockedIn=!!a?.clock_in&&!a?.clock_out;document.getElementById('clockBtn').textContent=clockedIn?'下班打卡':'上班打卡';if(a)document.getElementById('clockMsg').innerHTML='<p>上班：'+(a.clock_in||'—')+'　下班：'+(a.clock_out||'—')+'</p>'}
async function clockAction(){if(!employee)return;let r;if(clockedIn){r=await sb.from('attendance').update({clock_out:new Date().toISOString()}).eq('employee_id',employee.id).eq('work_date',today()).is('clock_out',null)}else{r=await sb.from('attendance').insert({employee_id:employee.id,work_date:today(),clock_in:new Date().toISOString()})}if(r.error)return msg('clockMsg',r.error.message,true);await loadClock();if(!clockedIn){document.getElementById('announcements').classList.remove('hidden');document.getElementById('announcements').scrollIntoView({behavior:'smooth'})}}
async function loadAnnouncements(){let r=await sb.from('announcements').select('*').eq('is_published',true).lte('publish_at',new Date().toISOString()).order('publish_at',{ascending:false});let list=r.data||[];announcementIds=list.map(x=>x.id);document.getElementById('announcementList').innerHTML=list.length?list.map(x=>'<div class="card"><span class="pill">'+(x.priority||'一般')+'</span><h3>'+x.title+'</h3><p>'+x.content+'</p></div>').join(''):'<p class="muted">今日沒有公告</p>'}
async function markAnnouncementsRead(){for(const id of announcementIds)await sb.from('announcement_reads').upsert({announcement_id:id,employee_id:employee.id,read_at:new Date().toISOString()},{onConflict:'announcement_id,employee_id'});alert('已完成公告閱讀紀錄')}
async function loadTasks(){let r=await sb.from('work_tasks').select('*').eq('task_date',today()).order('sort_order');document.getElementById('taskList').innerHTML=(r.data||[]).map(x=>'<div class="notice"><h3>'+x.title+'</h3><p>'+ (x.description||'')+'</p></div>').join('')||'<p class="muted">今日沒有工作事項</p>'}
async function loadSchedule(){let r=await sb.from('shifts').select('*').eq('employee_id',employee.id).gte('shift_date',today()).order('shift_date').limit(7);document.getElementById('scheduleList').innerHTML=(r.data||[]).map(x=>'<p>📅 '+x.shift_date+'｜'+x.start_time+'–'+x.end_time+'</p>').join('')||'<p class="muted">尚無排班</p>'}
async function submitLeave(){let r=await sb.from('leave_requests').insert({employee_id:employee.id,leave_date:document.getElementById('leaveDate').value,reason:document.getElementById('leaveReason').value,status:'pending'});msg('leaveMsg',r.error?r.error.message:'已送出，等待主管審核',!r.error)}
async function submitCorrection(){let r=await sb.from('attendance_corrections').insert({employee_id:employee.id,work_date:document.getElementById('corrDate').value,reason:document.getElementById('corrReason').value,status:'pending'});msg('corrMsg',r.error?r.error.message:'已送出，等待主管審核',!r.error)}
async function submitClosing(){let r=await sb.from('daily_handover').insert({work_date:today(),employee_id:employee.id,cash:Number(cash.value||0),line_pay:Number(linepay.value||0),other_payment:Number(otherpay.value||0),expenses:Number(expenses.value||0),cash_difference:Number(difference.value||0),notes:handover.value});msg('closingMsg',r.error?r.error.message:'今日交班已送出',!r.error)}
sb.auth.onAuthStateChange((_,s)=>{if(s?.user&&!user)boot()});boot();
</script></body></html>
